[package]
name = "xgo_controller"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
serialport = { version = "4", default-features = false }
tract-onnx = "0.23"

[dev-dependencies]
nix = { version = "0.29", features = ["term", "fs"] }
